name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.14.0
        run: |
          curl --fail --location --silent --show-error \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output /tmp/zig.tar.xz
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  /tmp/zig.tar.xz" | sha256sum --check --strict
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"

      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Build and test
        run: make release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TwitchAdBlock-VAFT-iOS-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
